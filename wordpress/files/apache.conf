ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
</Directory>

# Never run PHP from the uploads folder
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php\d?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Block sensitive and version-revealing files, plus XML-RPC (brute-force target)
<FilesMatch "^(wp-config\.php|xmlrpc\.php|readme\.html|license\.txt|debug\.log|\.ht.*)$">
    Require all denied
</FilesMatch>

# Browser caching for static assets
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    ExpiresByType image/avif "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
</IfModule>

# Workers ≈ mem_limit / ~60 MB, so 1 GB → about 16
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    MaxRequestWorkers 16
    MaxConnectionsPerChild 1000
</IfModule>