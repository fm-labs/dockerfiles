---
# This workflow will build a Docker image and push it to Docker Hub
#
# Required repo secrets:
# - DOCKERHUB_USERNAME
# - DOCKERHUB_TOKEN
#
# Required repo variables:
# - DOCKERHUB_REPONAME


name: Publish image to Docker Hub

on:
  push:
    tags:
      - "wordpress-*"


jobs:
  publish:
    name: Publish image (PHP ${{ matrix.php_version }})
    runs-on: ubuntu-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.4", "8.3", "8.2", "8.1", "7.4"]

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout repo with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build, tag, and push image to Docker Hub
        id: build-image
        env:
          PHP_VERSION: ${{ matrix.php_version }}
          IMAGE_TAG: ${{ matrix.php_version }}-apache
          RELEASE_TAG: ${{ github.ref_name }}
          REPO_NAME: ${{ vars.DOCKERHUB_REPONAME }}
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -xe

          docker buildx build \
            -t $REGISTRY/$REPO_NAME:$IMAGE_TAG \
            -t $REGISTRY/$REPO_NAME:$IMAGE_TAG-$RELEASE_TAG \
            --build-arg PHP_VERSION=$PHP_VERSION \
            --progress=plain \
            --sbom=true \
            --provenance=true \
            --platform linux/amd64,linux/arm64 \
            -f ./wordpress/Dockerfile-apache \
            --push \
            ./wordpress

          echo "image=$REGISTRY/$REPO_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT
